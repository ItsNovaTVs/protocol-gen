body{background:#0a1228;color-scheme:dark}
@media print{body,.card,input,textarea,td,td input{background:#fff!important;color:#000!important}b{color:#000!important}body{background:#fff}.noprint{display:none!important}.card{box-shadow:none!important;border:0!important}textarea,input{border:0!important;resize:none}}

<body class="font-sans text-slate-200 min-h-screen">
<div class="max-w-3xl mx-auto px-4 py-6 pb-24">

<header class="noprint flex flex-wrap items-center justify-between gap-2 mb-5">
  <h1 data-i18n="title" class="font-serif text-2xl font-bold text-white">Versuchsprotokoll</h1>
  <div class="flex flex-wrap gap-2 text-sm">
    <div class="inline-flex rounded border border-[#2c4070] overflow-hidden" role="group" aria-label="Language"><button id="l-de" class="px-3 py-1.5">DE</button><button id="l-en" class="px-3 py-1.5 border-l border-[#2c4070]">EN</button></div>
    <button id="copy" data-i18n="copy" class="px-3 py-1.5 rounded border border-[#2c4070] bg-[#13213f] text-slate-100 hover:bg-[#1b2d54]">Als Text kopieren</button>
    <button id="dl" data-i18n="dl" class="px-3 py-1.5 rounded border border-[#2c4070] bg-[#13213f] text-slate-100 hover:bg-[#1b2d54]">Als .txt speichern</button>
    <button id="print" data-i18n="print" class="px-3 py-1.5 rounded border border-[#2c4070] bg-[#13213f] text-slate-100 hover:bg-[#1b2d54]">Drucken / PDF</button>
    <button id="reset" data-i18n="reset" class="px-3 py-1.5 rounded border border-rose-400/50 text-rose-300 bg-[#13213f] hover:bg-rose-950">Leeren</button>
  </div>
</header>

<main class="card bg-[#101b34] rounded-lg shadow-lg shadow-black/30 border border-[#22345c] p-5 sm:p-8 space-y-6">

  <div class="grid sm:grid-cols-[11rem_1fr] gap-4">
    <label class="block"><span class="text-sm font-medium text-slate-300" data-i18n="date">Datum</span>
      <input id="datum" type="date" class="mt-1 w-full rounded border border-[#2c4070] bg-[#0a1226] text-slate-100 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"></label>
    <label class="block"><span class="text-sm font-medium text-slate-300" data-i18n="head">Überschrift</span>
      <input id="titel" type="text" data-i18n-ph="headph" placeholder="z. B. Nachweis von Kohlenstoffdioxid" class="mt-1 w-full rounded border border-[#2c4070] bg-[#0a1226] text-slate-100 px-3 py-2 font-serif text-lg font-semibold focus:outline-none focus:ring-2 focus:ring-sky-400"></label>
  </div>

  <label class="block"><span class="text-sm font-medium text-slate-300"><b class="text-sky-400" data-i18n="lP">P</b> · <span data-i18n="p">Problem / Frage / Ziel des Versuchs</span></span>
    <textarea id="p" rows="3" class="auto mt-1 w-full rounded border border-[#2c4070] bg-[#0a1226] text-slate-100 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"></textarea></label>

  <label class="block"><span class="text-sm font-medium text-slate-300"><b class="text-sky-400" data-i18n="lH">H</b> · <span data-i18n="h">Überprüfbare Hypothese</span></span>
    <textarea id="h" rows="3" class="auto mt-1 w-full rounded border border-[#2c4070] bg-[#0a1226] text-slate-100 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"></textarea></label>

  <section>
    <div class="flex flex-wrap items-center justify-between gap-2">
      <span class="text-sm font-medium text-slate-300"><b class="text-sky-400" data-i18n="lB">B</b> · <span data-i18n="b">Beobachtungen (kurz, aber vollständig)</span></span>
      <div class="inline-flex rounded border border-[#2c4070] overflow-hidden text-sm noprint" role="group" data-i18n-aria="aria" aria-label="Darstellung der Beobachtung">
        <button id="m-text" data-i18n="mt" class="px-3 py-1.5">Text</button>
        <button id="m-table" data-i18n="mtab" class="px-3 py-1.5 border-l border-[#2c4070]">Tabelle</button>
      </div>
    </div>

    <div id="b-text" class="mt-1">
      <textarea id="btext" rows="5" class="auto w-full rounded border border-[#2c4070] bg-[#0a1226] text-slate-100 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"></textarea>
    </div>

    <div id="b-table" class="mt-2 hidden">
      <div class="flex flex-wrap gap-2 mb-2 text-sm noprint">
        <button id="addr" data-i18n="addr" class="px-2.5 py-1 rounded border border-[#2c4070] hover:bg-[#1b2d54]">+ Zeile</button>
        <button id="addc" data-i18n="addc" class="px-2.5 py-1 rounded border border-[#2c4070] hover:bg-[#1b2d54]">+ Spalte</button>
        <button id="delr" data-i18n="delr" class="px-2.5 py-1 rounded border border-[#2c4070] hover:bg-[#1b2d54]">− Zeile</button>
        <button id="delc" data-i18n="delc" class="px-2.5 py-1 rounded border border-[#2c4070] hover:bg-[#1b2d54]">− Spalte</button>
      </div>
      <div class="overflow-x-auto"><table id="tbl" class="border-collapse w-full"></table></div>
      <p class="noprint text-xs text-slate-400 mt-1" data-i18n="hint">Oben links steht die Beschriftung der Achsen: Werte&nbsp;A&nbsp;→ (Spalten) / Werte&nbsp;B&nbsp;↓ (Zeilen). Mit Tab springst du von Zelle zu Zelle.</p>
      <label class="block mt-3"><span class="text-sm font-medium text-slate-300" data-i18n="extra">Ergänzende Beobachtung (optional)</span>
        <textarea id="bextra" rows="2" class="auto mt-1 w-full rounded border border-[#2c4070] bg-[#0a1226] text-slate-100 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"></textarea></label>
    </div>
  </section>

  <label class="block"><span class="text-sm font-medium text-slate-300"><b class="text-sky-400" data-i18n="lD">D</b> · <span data-i18n="d">Deutung: Beobachtung, Reaktionsgleichungen, allgemeine Regeln</span></span>
    <textarea id="d" data-i18n-ph="dph" rows="6" class="auto mt-1 w-full rounded border border-[#2c4070] bg-[#0a1226] text-slate-100 px-3 py-2 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" placeholder="Alle Ergebnisse eintragen, auch wenn sie vom Ziel abweichen."></textarea></label>

  <label class="block"><span class="text-sm font-medium text-slate-300" data-i18n="fx">Fehlerquellen / Verbesserungsvorschläge (falls nötig)</span>
    <textarea id="f" rows="3" class="auto mt-1 w-full rounded border border-[#2c4070] bg-[#0a1226] text-slate-100 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400"></textarea></label>
</main>
<p id="toast" class="noprint fixed bottom-4 left-1/2 -translate-x-1/2 bg-sky-300 text-slate-950 text-sm px-4 py-2 rounded shadow opacity-0 transition-opacity pointer-events-none"></p>
</div>

<script>
const $=id=>document.getElementById(id), KEY='versuchsprotokoll-v1';
const fields=['datum','titel','p','h','btext','bextra','d','f'];
let st={mode:'text',rows:3,cols:3,cells:{}};
const T={de:{title:'Versuchsprotokoll',copy:'Als Text kopieren',dl:'Als .txt speichern',print:'Drucken / PDF',reset:'Leeren',date:'Datum',head:'Überschrift',headph:'z. B. Nachweis von Kohlenstoffdioxid',lP:'P',p:'Problem / Frage / Ziel des Versuchs',lH:'H',h:'Überprüfbare Hypothese',lB:'B',b:'Beobachtungen (kurz, aber vollständig)',lD:'D',d:'Deutung: Beobachtung, Reaktionsgleichungen, allgemeine Regeln',dph:'Alle Ergebnisse eintragen, auch wenn sie vom Ziel abweichen.',mt:'Text',mtab:'Tabelle',aria:'Darstellung der Beobachtung',addr:'+ Zeile',addc:'+ Spalte',delr:'− Zeile',delc:'− Spalte',hint:'Oben links steht die Beschriftung der Achsen: Werte A → (Spalten) / Werte B ↓ (Zeilen). Mit Tab springst du von Zelle zu Zelle.',corner:'Werte A → / Werte B ↓',extra:'Ergänzende Beobachtung (optional)',fx:'Fehlerquellen / Verbesserungsvorschläge (falls nötig)',fxs:'Fehlerquellen / Verbesserungen',copied:'Kopiert',copyfail:'Kopieren nicht möglich – bitte .txt speichern',confirm:'Alle Eingaben löschen?',fn:'Protokoll'},
en:{title:'Lab protocol',copy:'Copy as text',dl:'Save as .txt',print:'Print / PDF',reset:'Clear',date:'Date',head:'Title',headph:'e.g. Detection of carbon dioxide',lP:'P',p:'Problem / question / aim of the experiment',lH:'H',h:'Testable hypothesis',lB:'O',b:'Observations (short but complete)',lD:'I',d:'Interpretation: observation, reaction equations, general rules',dph:'Record all results, even if they deviate from the aim.',mt:'Text',mtab:'Table',aria:'Observation format',addr:'+ Row',addc:'+ Column',delr:'− Row',delc:'− Column',hint:'The top-left cell labels the axes: Values A → (columns) / Values B ↓ (rows). Press Tab to move between cells.',corner:'Values A → / Values B ↓',extra:'Additional observation (optional)',fx:'Sources of error / improvements (if needed)',fxs:'Sources of error / improvements',copied:'Copied',copyfail:"Copying isn't possible here – please save as .txt",confirm:'Delete all entries?',fn:'Protocol'}};
const t=k=>T[st.lang||'de'][k];
function applyLang(){const L=st.lang;document.documentElement.lang=L;document.title=t('title');
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.i18nAria)));
  const on='bg-sky-500 text-slate-950 font-medium',off='bg-[#13213f] text-slate-200 hover:bg-[#1b2d54]';
  $('l-de').className='px-3 py-1.5 '+(L==='de'?on:off);
  $('l-en').className='px-3 py-1.5 border-l border-[#2c4070] '+(L==='en'?on:off);
  build();}
function setLang(l){st.lang=l;applyLang();save();}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s){fields.forEach(f=>$(f).value=s[f]||'');st=Object.assign(st,s.st||{});}}catch(e){}}
function save(){try{const o={st};fields.forEach(f=>o[f]=$(f).value);localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function grow(t){t.style.height='auto';t.style.height=t.scrollHeight+2+'px'}
const cls='w-full min-w-[6rem] px-2 py-1.5 bg-transparent focus:outline-none focus:bg-[#1d3260]';
function build(){
  const t=$('tbl');t.innerHTML='';
  for(let r=0;r<=st.rows;r++){const tr=t.insertRow();
    for(let c=0;c<=st.cols;c++){const td=tr.insertCell();const k=r+','+c;
      td.className='border border-[#34497a] p-0 '+((r==0||c==0)?'bg-[#18294d] text-sky-200 font-semibold':'');
      const i=document.createElement('input');i.className=cls;i.value=st.cells[k]||'';
      if(r==0&&c==0)i.placeholder=t('corner');
      i.addEventListener('input',()=>{st.cells[k]=i.value;save()});td.appendChild(i);}}
}
function mode(m){st.mode=m;
  $('b-text').classList.toggle('hidden',m!=='text');$('b-table').classList.toggle('hidden',m!=='table');
  const on='bg-sky-500 text-slate-950 font-medium',off='bg-[#13213f] text-slate-200 hover:bg-[#1b2d54]';
  $('m-text').className='px-3 py-1.5 '+(m==='text'?on:off);
  $('m-table').className='px-3 py-1.5 border-l border-[#2c4070] '+(m==='table'?on:off);
  if(m==='table')build();document.querySelectorAll('textarea.auto').forEach(grow);save();}
function resize(dr,dc){st.rows=Math.max(1,st.rows+dr);st.cols=Math.max(1,st.cols+dc);
  for(const k of Object.keys(st.cells)){const[r,c]=k.split(',').map(Number);if(r>st.rows||c>st.cols)delete st.cells[k];}
  build();save();}
function toText(){
  let o='';const d=$('datum').value;if(d)o+=(st.lang==='de'?d.split('-').reverse().join('.'):d)+'\n';
  if($('titel').value)o+=$('titel').value+'\n';o+='\n';
  o+=t('lP')+': '+$('p').value+'\n\n'+t('lH')+': '+$('h').value+'\n\n'+t('lB')+': ';
  if(st.mode==='text')o+=$('btext').value+'\n';
  else{o+='\n';for(let r=0;r<=st.rows;r++){const row=[];for(let c=0;c<=st.cols;c++)row.push(st.cells[r+','+c]||'');o+='| '+row.join(' | ')+' |\n';if(r==0)o+='|'+row.map(()=>'---').join('|')+'|\n';}
    if($('bextra').value)o+='\n'+$('bextra').value+'\n';}
  o+='\n'+t('lD')+': '+$('d').value+'\n';
  if($('f').value)o+='\n'+t('fxs')+': '+$('f').value+'\n';
  return o;}
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)}

load();
if(!st.lang)st.lang=(navigator.language||'de').toLowerCase().startsWith('de')?'de':'en';
fields.forEach(f=>$(f).addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA')grow(e.target);save()}));
$('l-de').onclick=()=>setLang('de');$('l-en').onclick=()=>setLang('en');
$('m-text').onclick=()=>mode('text');$('m-table').onclick=()=>mode('table');
$('addr').onclick=()=>resize(1,0);$('addc').onclick=()=>resize(0,1);$('delr').onclick=()=>resize(-1,0);$('delc').onclick=()=>resize(0,-1);
$('print').onclick=()=>window.print();
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(toText());toast(t('copied'))}catch(e){toast(t('copyfail'))}};
$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([toText()],{type:'text/plain'}));
  a.download=t('fn')+($('datum').value?'_'+$('datum').value:'')+'.txt';a.click();};
$('reset').onclick=()=>{if(confirm(t('confirm'))){fields.forEach(f=>$(f).value='');st={mode:'text',rows:3,cols:3,cells:{},lang:st.lang};mode('text');save();}};
if(!$('datum').value)$('datum').value=new Date().toISOString().slice(0,10);
applyLang();mode(st.mode);
</script>
</body>
</html>
